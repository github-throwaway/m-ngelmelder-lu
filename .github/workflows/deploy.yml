name: Daten aktualisieren und auf Pages veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"     # stündlich zur Minute 17
  workflow_dispatch:          # Knopf zum manuellen Auslösen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Meldungen vom Mängelmelder holen
        run: python scripts/fetch_data.py

      - name: Seite als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
